lidar:
  - driver:
      use_gpu: false
      source_type: 1                                  # 1: real-time lidar (live UDP)
      lidar_udp_type:
        device_ip_address: ""                         # lidar IP for PTC; "" = use source IP of incoming UDP. Filled after discovery if PTC enabled.
        udp_port: 2368                                # UDP destination port (matches Pandar default)
        ptc_port: 9347                                # PTC port of lidar
        multicast_ip_address: 255.255.255.255

        # First-light: rely on the LOCAL correction file and skip the PTC TCP
        # connection, so we do NOT need to reach the lidar's IP to get a cloud.
        # Once data is confirmed, can flip use_ptc_connected: true with the
        # discovered device_ip_address for live correction/standby control.
        use_ptc_connected: false
        host_ptc_port: 0
        correction_file_path: "/home/cave/ros2_ws/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/Pandar40P_Angle Correction File.csv"
        firetimes_path: "/home/cave/ros2_ws/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/Pandar40P_Firetime Correction File.csv"

        recv_point_cloud_timeout: 1000   # ms; was -1 (infinite). Finite => a stalled recv
                                         # returns and the driver loops instead of hanging.
        ptc_connect_timeout: -1

        host_ip_address: ""
        fault_message_port: 0

        standby_mode: -1
        speed: -1
        ptc_mode: 0
        certFile: ""
        privateKeyFile: ""
        caFile: ""

      pcap_type:
        pcap_path: "Your pcap file"
        correction_file_path: "/home/cave/ros2_ws/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/Pandar40P_Angle Correction File.csv"
        firetimes_path: "/home/cave/ros2_ws/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/Pandar40P_Firetime Correction File.csv"
        pcap_play_synchronization: true
        pcap_play_in_loop: false
        play_rate_: 1.0

      rosbag_type:
        correction_file_path: "Your correction file path"
        firetimes_path: "Your firetime file path"

      serial_type:
        rs485_com: ""
        rs232_com: ""
        point_cloud_baudrate: 3125000
        correction_save_path: ""
        correction_file_path: ""

      # public module
      # 1 = HOST timestamp: the Pi stamps each cloud/point with its own receive
      # clock — the SAME clock the encoder node uses (get_clock().now()). This is
      # what makes lidar<->encoder deskew align without an RTC or PTP. Do NOT set
      # 0 here: that uses the lidar's internal clock (reads year-2000 with no PTP)
      # and would desync from the encoder. (migration/hesai-web 2026-05-30)
      use_timestamp_type: 1
      frame_start_azimuth: 0
      thread_num: 4
      transform_flag: false
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
      fov_start: -1
      fov_end:  -1
      channel_fov_filter_path: ""
      multi_fov_filter_ranges: ""
      enable_packet_loss_tool: true
      distance_correction_flag: false
      xt_spot_correction: false
      device_udp_src_port: 0
      device_fault_port: 0
      frame_frequency: 0
      default_frame_frequency: 10.0         # Pandar40P default 10 Hz
      echo_mode_filter: 0

    ros:
      # ── MIGRATION DECISION: keep VLP-16 topic + frame so all downstream
      #    (hmi/app.py RECORD_TOPICS, hmi_bridge recorder, ROBIN deskew, TF) is unchanged.
      ros_frame_id: velodyne
      ros_recv_packet_topic: /lidar_packets
      ros_send_packet_topic: /lidar_packets
      ros_send_point_cloud_topic: /velodyne_points
      ros_send_imu_topic: /lidar_imu
      ros_send_packet_loss_topic: /lidar_packets_loss
      send_packet_ros: false
      send_point_cloud_ros: true
      send_imu_ros: false                   # Pandar40P has no IMU; N100 provides /imu
